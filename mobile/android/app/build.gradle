apply plugin: 'com.android.application'

// This build's version, from the release.json scripts/bundle-node.js writes (one source for the
// app, its update checks and this APK): 1.2.3 -> versionName "1.2.3", versionCode 10203.
def posRelease = new groovy.json.JsonSlurper().parse(file('../../www/nodejs/release.json'))
def versionParts = posRelease.version.tokenize('.').collect { it as int }

// The release signing key: never in the repository. CI passes it in the environment (see
// .github/workflows/release.yml); on a developer's machine it's read from
// ~/.pos-release/keystore.properties (storeFile, storePassword, keyAlias, keyPassword).
// Every release must be signed with the same key, or phones can't update in place.
def signingProps = new Properties()
def localSigning = new File(System.getProperty('user.home'), '.pos-release/keystore.properties')
if (localSigning.exists()) localSigning.withInputStream { signingProps.load(it) }
def signingValue = { String env, String prop -> System.getenv(env) ?: signingProps.getProperty(prop) }

android {
    namespace = "pk.pos.register"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "pk.pos.register"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]
        versionName posRelease.version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Phones only (every current Android phone is arm64): the Node.js runtime is ~40 MB per ABI.
        ndk { abiFilters 'arm64-v8a' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def store = signingValue('ANDROID_KEYSTORE_FILE', 'storeFile')
            if (store) {
                storeFile file(store)
                storePassword signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
                keyAlias signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
                keyPassword signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (signingConfigs.release.storeFile) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// pos-register-1.2.3.apk, the name the release and the in-app updater use.
android.applicationVariants.all { variant ->
    variant.outputs.all { outputFileName = "pos-register-${posRelease.version}${variant.buildType.name == 'release' ? '' : '-' + variant.buildType.name}.apk" }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
