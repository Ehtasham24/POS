plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.possystem.paymentforwarder'
    compileSdk 34

    defaultConfig {
        applicationId "com.possystem.paymentforwarder"
        // minSdk 24 (Android 7.0) — deliberately broad, not the newest baseline, since a
        // "spare phone dedicated to this one job" is exactly the kind of older device a
        // small shop already has lying around rather than buying new for this.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // WorkManager — the heartbeat ping (HeartbeatWorker.kt). Its periodic-work minimum
    // interval is 15 minutes, which is why Controller/paymentNotificationController.js's
    // STALE_AFTER_MINUTES is set to 20 (a bit more than one interval, so a single slightly-
    // late tick doesn't immediately look like an outage).
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
