# Included from every location in pos.conf that sets its own add_header. nginx does NOT
# merge add_header across levels: a location with even one add_header silently drops
# every add_header inherited from the server block. Keeping these in one include means
# no location can accidentally ship without them.

# HTTPS-only for a year once a browser has seen this site over HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# The app is never meant to be framed by another site (clickjacking).
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
