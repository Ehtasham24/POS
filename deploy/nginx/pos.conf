# Reverse proxy in front of the Express app (ExpressBackend/server.js).
#
#   Internet --HTTPS:443--> nginx --HTTP--> Express 127.0.0.1:4000
#
# nginx owns: TLS (a real Let's Encrypt certificate), gzip, security headers, rate limiting
# on login/password-reset/webhooks, and long-lived caching of the fingerprinted frontend
# assets. Express keeps everything that needs the database: auth, shop isolation, tier
# gating. Nothing here replaces a check the app already does.
#
# Setup (Ubuntu/Debian):
#   1. Replace every "pos.example.com" below with your real domain.
#   2. sudo cp pos.conf /etc/nginx/sites-available/pos.conf
#      sudo cp security-headers.conf /etc/nginx/snippets/pos-security-headers.conf
#      sudo ln -s /etc/nginx/sites-available/pos.conf /etc/nginx/sites-enabled/
#   3. sudo certbot certonly --webroot -w /var/www/certbot -d pos.example.com
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. In ExpressBackend's env: TRUST_PROXY=loopback and APP_HTTPS=false, then restart it.
#   6. Firewall: only 80 and 443 public. Ports 4000/4001 must NOT be reachable from outside,
#      or the proxy (and its rate limits) can simply be walked around.

# Rate-limit buckets, keyed by client IP. Login and forgot-password are the brute-force
# targets; webhooks get a looser bucket (a phone forwarder or payment gateway can burst a
# few legitimate calls back to back). Several shops behind one NAT share an IP, so these
# are sized for "a human typing", not "one request per shop".
limit_req_zone $binary_remote_addr zone=pos_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pos_webhook:10m rate=60r/m;
limit_req_status 429;

upstream pos_app {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Plain HTTP: only the certbot challenge, everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name pos.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pos.example.com;

    ssl_certificate     /etc/letsencrypt/live/pos.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pos_ssl:10m;
    ssl_session_timeout 1d;

    # Matches express.json({ limit: "2mb" }) in server.js (a base64 company logo is the
    # largest legitimate body). Anything bigger is rejected here, before reaching Node.
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Shared by every proxied location. $proxy_add_x_forwarded_for appends the real client
    # address; Express reads it back via req.ip only because TRUST_PROXY tells it to.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    include /etc/nginx/snippets/pos-security-headers.conf;

    # Brute-force targets: shop login, admin login (same endpoint), forgot-password.
    location ~ ^/api/auth/(login|forgot-password)$ {
        limit_req zone=pos_auth burst=5 nodelay;
        proxy_pass http://pos_app;
    }

    # Phone forwarder + payment gateway callbacks.
    location ^~ /api/bank-payments/webhook/ {
        limit_req zone=pos_webhook burst=20 nodelay;
        proxy_pass http://pos_app;
    }

    # CRA's build output is content-hashed (main.<hash>.js), so a given URL never changes
    # content — safe to cache for a year.
    location ^~ /static/ {
        proxy_pass http://pos_app;
        # Express's static middleware sends its own Cache-Control: public, max-age=0 — drop
        # it, or the response carries two conflicting Cache-Control headers.
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/pos-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # These two must always be revalidated, or a deploy never reaches browsers: the service
    # worker decides what the PWA caches, and index.html points at the current hashed bundle.
    location ~ ^/(service-worker\.js|index\.html)$ {
        proxy_pass http://pos_app;
        proxy_hide_header Cache-Control;
        include /etc/nginx/snippets/pos-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass http://pos_app;
    }
}
